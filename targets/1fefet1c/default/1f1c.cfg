# 1F1C default: one 128x128 array (Laleni et al. 2024, Sec. IV).
# 128 rows x 128 cols = 16384 cells = 2KB; one row = 128 bits.

-DesignTarget: RAM
-ProcessNode: 28
-Capacity (KB): 2
-WordWidth (bit): 128

# FeFET is embedded in GF 28nm SLP (super low power) HKMG
# (Trentzsch et al., IEDM 2016) -> low-power roadmap.
-DeviceRoadmap: LSTP

-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No

-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: H-tree
-InternalSensing: true

-MemoryCellInputFile: 1f1c.cell

-Temperature (K): 300

-BufferDesignOptimization: latency

# Force one undivided array (no banks/mats/muxes).
-ForceBank (Total AxB, Active CxD): 1x1, 1x1
-ForceMat (Total AxB, Active CxD): 1x1, 1x1
-ForceMuxSenseAmp: 1
-ForceMuxOutputLev1: 1
-ForceMuxOutputLev2: 1
