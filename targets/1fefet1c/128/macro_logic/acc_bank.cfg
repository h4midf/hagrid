# One accumulator SRAM bank of the 128 x 128 config's shift-and-add
# (macro_logic/rtl/shift_add_flip.v): OUTS / UNITS = 32 / 4 = 8 words of ACC = 23 bits
# = 23 B. characterize_shift_add.py checks these two lines against params.py and fails
# if they differ.
-Capacity (B): 23
-WordWidth (bit): 23

-DesignTarget: RAM
-ProcessNode: 28

# same roadmap as the array (1f1c.cfg): GF 28nm SLP, low-power
-DeviceRoadmap: LSTP

-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No

-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: H-tree
-InternalSensing: true

# NVSim's own 6T SRAM cell (146 F^2)
-MemoryCellInputFile: ../../NVSim/SRAM.cell

-Temperature (K): 300

# one slot is a 50 ns clock cycle, so latency does not matter: smallest bank
-OptimizationTarget: Area

# one undivided array (NVSim cannot partition a bank this small)
-ForceBank (Total AxB, Active CxD): 1x1, 1x1
-ForceMat (Total AxB, Active CxD): 1x1, 1x1
-ForceMuxSenseAmp: 1
-ForceMuxOutputLev1: 1
-ForceMuxOutputLev2: 1
